[build]
  publish = "."

# Phones must always get the newest service worker and page, so updates land on the next open.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"
